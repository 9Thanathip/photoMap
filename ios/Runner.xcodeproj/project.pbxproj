			shellPath = /bin/sh;
			shellScript = "set -e\nSRC=\"${SRCROOT}/config/${FIREBASE_CONFIG_DIR}/GoogleService-Info.plist\"\nif [ ! -f \"$SRC\" ]; then\n  echo \"error: no GoogleService-Info.plist at $SRC\"\n  exit 1\nfi\nDEST=\"${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}\"\nmkdir -p \"$DEST\"\ncp \"$SRC\" \"$DEST/GoogleService-Info.plist\"\n\n# google_sign_in reads CLIENT_ID out of the copied plist, but the OAuth\n# redirect comes back through a URL scheme that only Info.plist declares.\n# Patching it from the same plist keeps one source of truth per flavor.\nPB=/usr/libexec/PlistBuddy\nAPP_PLIST=\"$DEST/Info.plist\"\nCLIENT_ID=$(\"$PB\" -c \"Print :CLIENT_ID\" \"$SRC\" 2>/dev/null || true)\nREVERSED=$(\"$PB\" -c \"Print :REVERSED_CLIENT_ID\" \"$SRC\" 2>/dev/null || true)\n\nif [ -n \"$REVERSED\" ]; then\n  \"$PB\" -c \"Set :GIDClientID $CLIENT_ID\" \"$APP_PLIST\"\n  \"$PB\" -c \"Set :CFBundleURLTypes:0:CFBundleURLSchemes:0 $REVERSED\" \"$APP_PLIST\"\n  echo \"firebase config: ${FIREBASE_CONFIG_DIR}\"\nelse\n  # No CLIENT_ID means Google sign-in is not turned on for that Firebase\n  # project yet. Leaving the checked-in prod scheme would quietly route the\n  # callback at the wrong project, so drop it and let sign-in fail loudly.\n  \"$PB\" -c \"Delete :GIDClientID\" \"$APP_PLIST\" 2>/dev/null || true\n  \"$PB\" -c \"Delete :CFBundleURLTypes\" \"$APP_PLIST\" 2>/dev/null || true\n  echo \"warning: ${FIREBASE_CONFIG_DIR} plist has no CLIENT_ID - Google sign-in unavailable in this build\"\nfi\n";
